version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: salao_db
    environment:
      POSTGRES_USER: salao_admin
      POSTGRES_PASSWORD: salao_secret_2024
      POSTGRES_DB: salao_marketing
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
